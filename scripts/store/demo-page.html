<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurora Audio — Wireless Headphones</title>
    <style>
      body {
        margin: 0;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      header {
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        padding: 18px 48px;
        font-weight: 700;
        font-size: 18px;
        color: #0d9488;
      }
      main {
        max-width: 960px;
        margin: 48px auto;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 48px;
        padding: 0 24px;
      }
      .photo {
        background: linear-gradient(135deg, #99f6e4, #0d9488);
        border-radius: 16px;
        height: 380px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 96px;
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      .rating { color: #f59e0b; margin-bottom: 16px; }
      .price { font-size: 32px; font-weight: 750; margin: 12px 0 4px; }
      .note { color: #64748b; font-size: 13px; }
      .desc { margin-top: 20px; color: #334155; }
      button.buy {
        margin-top: 24px;
        background: #0d9488;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 32px;
        font: inherit;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <header>aurora.audio</header>
    <main>
      <div class="photo">🎧</div>
      <section>
        <h1>Aurora ANC Wireless Headphones</h1>
        <div class="rating">★★★★★ 4.8 · 2,341 reviews</div>
        <div class="price" id="price">€249,99</div>
        <div class="note">Free EU shipping · 2-year warranty</div>
        <p class="desc">
          Studio-grade active noise cancellation, 40-hour battery life, and
          spatial audio. Ships worldwide from our Berlin warehouse.
        </p>
        <button class="buy">Add to cart</button>
      </section>
    </main>
  </body>
</html>
